<!doctype html>
<!--
  Application shell.

  Responsibility: document scaffold, global layout landmarks, design-system wiring, and the
  slots each capability module renders into.

  Place in the system: UI spine (Standard 10). It owns layout, navigation, and the
  signed-in/signed-out composition only. It contains no business rules — those live in each
  module's own UI directory, which this page loads as module scripts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundation Lab</title>
    <link rel="stylesheet" href="/foundation.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/modules/customers/session.css" />
    <link rel="stylesheet" href="/modules/projects/projects.css" />
    <link rel="stylesheet" href="/modules/triage/triage.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="app-header">
      <div class="app-header__inner cluster">
        <span class="app-brand">Foundation Lab</span>
        <nav aria-label="Primary" hidden data-testid="primary-nav">
          <ul class="cluster app-nav">
            <li><a href="/" aria-current="page">Workspace</a></li>
          </ul>
        </nav>
        <span class="cluster">
          <span class="text-muted app-actor" data-testid="actor-badge" hidden></span>
          <button type="button" data-testid="sign-out" hidden>Sign out</button>
          <span class="text-muted app-env" data-testid="environment-badge" title="Loading deployment identity"></span>
        </span>
      </div>
    </header>

    <main id="main" class="app-main stack">
      <!-- Exactly one of these is present at a time. The signed-out view is not a modal over
           the application; the application is simply not rendered until there is a session. -->
      <div data-testid="signed-out-view" hidden>
        <h1>Foundation Lab</h1>
        <div data-signin-root></div>
      </div>

      <div data-testid="signed-in-view" hidden class="stack">
        <h1>Workspace</h1>

        <section aria-labelledby="projects-heading">
          <h2 id="projects-heading">Projects</h2>
          <div data-projects-root></div>
        </section>

        <section aria-labelledby="releases-heading">
          <h2 id="releases-heading">Releases</h2>
          <div data-releases-root></div>
        </section>

        <section aria-labelledby="incidents-heading">
          <h2 id="incidents-heading">Incidents</h2>
          <div data-incidents-root></div>
        </section>

        <section aria-labelledby="triage-section-heading">
          <h2 id="triage-section-heading">Incident analysis</h2>
          <div data-triage-root></div>
        </section>
      </div>
    </main>

    <script type="module" src="/shell.js"></script>
  </body>
</html>
